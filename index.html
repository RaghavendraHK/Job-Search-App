<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JobFinder | Job Search App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>💼 JobFinder</h1>
        <p>Search jobs in real time</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter job title (e.g. developer)">
        <button onclick="searchJobs()">Search</button>
    </div>

    <div id="jobResults" class="jobs"></div>

    <script src="script.js"></script>
</body>

</html>
